name: PR-Agent

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          (contains(fromJSON('["/review", "/describe", "/improve"]'), github.event.comment.body) ||
            startsWith(github.event.comment.body, '/ask ')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add the GEMINI_API_KEY repository Actions secret to enable PR-Agent."
            exit 1
          fi

      - name: PR Agent
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: 'gemini/gemini-3.8-flash'
          config.fallback_models: '[]'
          config.restricted_mode: 'true'
          config.log_level: 'INFO'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "ready_for_review"]'
          github_action_config.handle_push_trigger: 'false'
          github_action_config.fail_on_tool_errors: 'true'
