name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Types, lint, formatting and contracts
        run: bun run check
      - name: Web build
        run: bun run web:build
      - name: Dependency audit
        run: bun audit --audit-level=high
      - name: Reject trusted dependency scripts
        run: |
          trusted=$(node -e "process.stdout.write(String((require('./package.json').trustedDependencies||[]).length))")
          if [ "$trusted" != "0" ]; then
            echo "trustedDependencies must remain empty" >&2
            exit 1
          fi
