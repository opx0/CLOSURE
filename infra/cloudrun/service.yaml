# Showcase-on-demand, not an always-on public service (ADR-025). minScale is 0 on purpose: the
# instance exists while it is being shown and costs nothing the rest of the time.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: closer-showcase
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/cloudsql-instances: PROJECT:REGION:closer
    spec:
      containerConcurrency: 20
      timeoutSeconds: 120
      serviceAccountName: closer-showcase@PROJECT.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/closer/server:TAG
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: CLOSER_STORE
              value: postgres
            - name: CLOSER_DEMO_MODE
              value: 'true'
            - name: CLOSER_RATE_LIMIT_PER_MINUTE
              value: '60'
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: closer-database-url
                  key: latest
            # The key itself never appears in a manifest, a log, or an image layer.
            - name: MODEL_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: closer-model-key
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
