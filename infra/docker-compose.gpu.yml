# GPU overlay for the llama.cpp service. Requires the NVIDIA Container Toolkit.
# Use with the base file: bun run llama:up:gpu
services:
  llama:
    image: ${LLAMA_IMAGE_GPU:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    command: >
      -hf ${LLAMA_HF_REPO:-Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMA_CONTEXT:-8192}
      --jinja
      -ngl ${LLAMA_NGL:-999}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
